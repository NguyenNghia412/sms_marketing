<div class="flex flex-col gap-3">
    @if (loading) {
        <div class="text-center py-4">Đang tải...</div>
    } @else if (truongData.length === 0) {
        <div class="text-center py-4 text-surface-600">Không có trường dữ liệu</div>
    } @else {
        <p class="text-base text-surface-600 mb-2">Tích chọn trường muốn ẩn:</p>
        @for (item of truongData; track item.id) {
            <div class="flex items-center gap-2">
                <p-checkbox
                    [binary]="true"
                    [(ngModel)]="checkedMap[item.id!]"
                />
                <label>{{ item.tenTruong }}</label>
            </div>
        }
    }

    <div class="flex justify-end gap-2 mt-4">
        <p-button label="Huỷ" severity="secondary" (onClick)="onCancel()" />
        <p-button label="OK" (onClick)="onConfirm()" />
    </div>
</div>
