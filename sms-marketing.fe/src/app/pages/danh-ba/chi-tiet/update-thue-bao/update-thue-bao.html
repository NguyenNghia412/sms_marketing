<form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="mb-3">
        <label for="hoVaTen" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Họ và tên <span class="text-red-500">*</span></label>
        <input pInputText formControlName="hoVaTen" id="hoVaTen" type="text" class="w-full" />
        @if (form.get('hoVaTen')?.hasError('required') && form.get('hoVaTen')?.touched) {
        <p-message severity="error" variant="simple" size="small">{{ getError('hoVaTen') }}</p-message>
        }
    </div>

    <div class="mb-3">
        <label for="soDienThoai" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Số điện thoại <span class="text-red-500">*</span></label>
        <input pInputText formControlName="soDienThoai" id="soDienThoai" type="text" class="w-full" />
        @if (form.get('soDienThoai')?.hasError('required') && form.get('soDienThoai')?.touched) {
        <p-message severity="error" variant="simple" size="small">{{ getError('soDienThoai') }}</p-message>
        }
    </div>

    <div class="flex gap-2 mt-4" style="justify-content: flex-end;">
        <p-button label="Hủy" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="onCancel()" />
        <p-button label="Lưu" icon="pi pi-save" type="submit" (onClick)="onSubmit()" [loading]="loading" />
    </div>

</form>
