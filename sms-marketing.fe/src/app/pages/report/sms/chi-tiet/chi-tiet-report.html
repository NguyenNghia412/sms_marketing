<div class="card">
    <div class="flex flex-row justify-between items-center mb-4">
        <div class="font-semibold text-xl uppercase">Thống kê chi tiết chiến dịch gửi SMS</div>
    </div>
    <p-breadcrumb [home]="home" [model]="items" />
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="flex flex-row justify-between items-center space-x-2">
            <div class="flex flex-row justify-between items-center space-x-2 flex-1">
                <div class="flex flex-row items-center space-x-2 flex-1 max-w-2xl">
                    <p-iconfield class="w-full">
                        <p-inputicon class="pi pi-search" />
                        <input formControlName="search" pInputText type="text" placeholder="Tìm kiếm ..." class="w-full" />
                    </p-iconfield>
                    <p-button type="button" icon="pi pi-filter" [label]="filterButtonLabel" (onClick)="filterPanel.toggle($event)" [outlined]="!hasActiveFilters" [severity]="hasActiveFilters ? 'info' : undefined" styleClass="whitespace-nowrap" />
                </div>
            </div>
            <div class="flex flex-row items-center space-x-2 flex-shrink-0">
                <p-button label="Tìm kiếm" type="submit" styleClass="w-32" />
                @if (isSelectMode) {
                    <p-button label="Tạo danh bạ" icon="pi pi-check" (onClick)="showCreateDanhBaDialog()" [disabled]="selectedItems.length === 0" />
                    <p-button label="Hủy" icon="pi pi-times" severity="secondary" (onClick)="onToggleSelectMode()" />
                } @else {
                    <p-button icon="pi pi-cog" label="Thao tác" (onClick)="actionMenu.toggle($event)" />
                    <p-menu #actionMenu [model]="actionMenuItems" [popup]="true" />
                }
            </div>
        </div>
        <p-popover #filterPanel [style]="{ width: '320px' }">
            <div class="flex flex-col space-y-4 p-4">
                <div>
                    <label for="trangThai" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Trạng thái</label>
                    <p-select formControlName="trangThai" id="trangThai" [options]="statusList" optionLabel="name" optionValue="code" placeholder="Tất cả" [showClear]="true" styleClass="w-full" [appendTo]="'body'" (onChange)="onSearch(); filterPanel.hide()" />
                </div>
            </div>
        </p-popover>
    </form>
    <div class="mt-4 relative">
        <app-data-table tableKey="chi-tiet-chien-dich-report" [columns]="columns" [data]="data" [loading]="loading" (onCustomComp)="onCustomEmit($event)" [total]="totalRecords" [pageNumber]="query.pageNumber" [pageSize]="query.pageSize" (onPageChanged)="onPageChanged($event)" />
        <div class="absolute bottom-0 right-0 text-base text-surface-600 dark:text-surface-400 border border-surface-300 dark:border-surface-600 rounded px-4 py-2">
            Thống kê: <span class="font-semibold">{{ totalRecords }}</span>
        </div>
    </div>
</div>
<p-dialog header="Tạo danh bạ mới" [(visible)]="createDanhBaDialogVisible" [modal]="true" [style]="{ width: '400px' }">
    <div class="flex flex-col space-y-4">
        <div>
            <label for="tenDanhBa" class="block font-medium mb-2">Tên danh bạ</label>
            <input pInputText id="tenDanhBa" [(ngModel)]="tenDanhBaMoi" placeholder="Nhập tên danh bạ" class="w-full" />
        </div>
    </div>
    <ng-template #footer>
        <p-button label="Hủy" icon="pi pi-times" severity="secondary" (onClick)="createDanhBaDialogVisible = false" />
        <p-button label="Lưu" icon="pi pi-check" (onClick)="createDanhBa()" [disabled]="!tenDanhBaMoi.trim()" />
    </ng-template>
</p-dialog>
