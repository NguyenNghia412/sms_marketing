<div class="card">
    <div class="flex flex-row justify-between items-center mb-4">
        <div class="font-semibold text-xl uppercase">Thống kê chiến dịch gửi SMS</div>
    </div>

    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="flex flex-row justify-between items-center space-x-2">
            <div class="flex flex-row justify-between items-center space-x-2 flex-1">
                <div class="flex flex-row items-center space-x-2 flex-1 max-w-2xl">
                    <p-iconfield class="w-full">
                        <p-inputicon class="pi pi-search" />
                        <input formControlName="search" pInputText type="text" placeholder="Tìm kiếm chiến dịch..." class="w-full" />
                    </p-iconfield>
                    <p-button type="button" icon="pi pi-filter" label="Tìm kiếm theo" (onClick)="filterPanel.toggle($event)" [outlined]="true" styleClass="whitespace-nowrap" />
                </div>
            </div>
            
            <div class="flex flex-row space-x-2">
                <p-button label="Tìm kiếm" type="submit" styleClass="w-32 flex-shrink-0" />
                
                @if (isExportMode) {
                    <p-button type="button" icon="pi pi-download" label="Export" [disabled]="selectedChienDichs.length === 0" [loading]="loading" (click)="onConfirmExport()" />
                    <p-button type="button" icon="pi pi-times" label="Hủy" severity="secondary" (click)="onExportTheoChienDich()" />
                } 
                @else {
                    <p-button #exportBtn icon="pi pi-download" type="button" label="Export" (click)="exportPopover.toggle($event)" />
                }
            </div>
        </div>
        <p-popover #filterPanel [style]="{ width: '600px' }">
            <div class="flex flex-col space-y-4 p-4">
                <div class="flex flex-row items-center space-x-4">
                    <div class="flex-1">
                        <label for="fromDate" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Từ ngày</label>
                        <p-datepicker formControlName="fromDate" id="fromDate" [showIcon]="true" [showOnFocus]="false" dateFormat="dd/mm/yy" placeholder="Chọn ngày bắt đầu" styleClass="w-full" [appendTo]="'body'" />
                    </div>
                    <div class="flex items-center pt-6">
                        <span class="text-surface-500">-</span>
                    </div>
                    <div class="flex-1">
                        <label for="toDate" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Đến ngày</label>
                        <p-datepicker formControlName="toDate" id="toDate" [showIcon]="true" [showOnFocus]="false" dateFormat="dd/mm/yy" placeholder="Chọn ngày kết thúc" styleClass="w-full" [appendTo]="'body'" />
                    </div>
                </div>
                <div>
                        <label for="sapXepTheo" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Sắp xếp theo</label>
                        <p-select formControlName="sapXepTheo" id="sapXepTheo" [options]="orderByList" optionLabel="name" optionValue="code" placeholder="Chọn cách sắp xếp" [showClear]="true" styleClass="w-full" [appendTo]="'body'" />
                </div>
            </div>
        </p-popover>
    </form>

    <div class="mt-4 relative">
        <app-data-table [columns]="columns" [data]="data" [loading]="loading" (onCustomComp)="onCustomEmit($event)" [total]="totalRecords" [pageNumber]="query.pageNumber" [pageSize]="query.pageSize" (onPageChanged)="onPageChanged($event)" />
        <div class="absolute bottom-0 right-0 text-base text-surface-600 dark:text-surface-400 border border-surface-300 dark:border-surface-600 rounded px-4 py-2">
            Chiến dịch: <span class="font-semibold">{{ totalRecords }}</span>
        </div>
    </div>
</div>

<p-popover #exportPopover>
    <div class="flex flex-row space-x-0">
        <div class="flex flex-col space-y-2 p-2">
            <p-button #monthBtn label="Export theo tháng" icon="pi pi-calendar" [loading]="loading" (onClick)="monthPopover.toggle($event)" styleClass="w-full justify-center" />
            <p-button label="Export theo chiến dịch" icon="pi pi-list" [loading]="loading" (onClick)="onExportTheoChienDich()" styleClass="w-full justify-center" />
        </div>
    </div>
</p-popover>

<p-popover #monthPopover [appendTo]="'body'">
    <div class="p-4 min-w-[280px]">
        <div class="font-semibold mb-3">Chọn tháng/năm</div>
        <p-datepicker [(ngModel)]="selectedMonthYear" view="month" dateFormat="mm/yy" (onSelect)="onMonthYearSelect()" [inline]="true" class="w-full"> </p-datepicker>
    </div>
</p-popover>

<p-confirmDialog></p-confirmDialog>
