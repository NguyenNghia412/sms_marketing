<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
        <label for="idUser" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Người dùng <span class="text-red-500">*</span></label>
        <p-select formControlName="idUser" [options]="listUsers" optionLabel="fullName" optionValue="id" placeholder="Chọn người dùng" [filter]="true" filterBy="fullName,userName" class="w-full" styleClass="w-full" />
        @if (form.get('idUser')?.hasError('required') && form.get('idUser')?.touched) {
        <p-message severity="error" variant="simple" size="small">{{ getError('idUser') }} </p-message>
        }
    </div>

    <div class="mb-3">
        <label for="idBrandName" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Brand Name <span class="text-red-500">*</span></label>
        <p-multiselect formControlName="idBrandName" [options]="listBrandName" optionLabel="tenBrandName" optionValue="id" placeholder="Chọn brand name" [filter]="true" filterBy="tenBrandName" class="w-full" styleClass="w-full" />
        @if (form.get('idBrandName')?.hasError('required') && form.get('idBrandName')?.touched) {
        <p-message severity="error" variant="simple" size="small">{{ getError('idBrandName') }} </p-message>
        }
    </div>

    <div class="mb-3">
        <label for="thoiGianBatDauSuDungDichVu" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Thời gian bắt đầu sử dụng</label>
        <p-datePicker formControlName="thoiGianBatDauSuDungDichVu" inputId="thoiGianBatDauSuDungDichVu" styleClass="w-full" [showIcon]="true" dateFormat="dd/mm/yy" appendTo="body" [showOnFocus]="false" />
    </div>

    <div class="mb-3">
        <label for="thoiGianKetThucSuDungDichVu" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Thời gian kết thúc sử dụng</label>
        <p-datePicker formControlName="thoiGianKetThucSuDungDichVu" inputId="thoiGianKetThucSuDungDichVu" styleClass="w-full" [showIcon]="true" dateFormat="dd/mm/yy" appendTo="body" [showOnFocus]="false" />
    </div>

    <div class="flex gap-2 mt-4" style="justify-content: flex-end;">
        <p-button label="Hủy" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="onCancel()" />
        <p-button label="Lưu" icon="pi pi-save" type="submit" [loading]="loading" />
    </div>
</form>
