<div class="card">
    <div class="flex flex-row justify-between items-center mb-4">
        <div class="font-semibold text-xl uppercase">Quản lý Nhà mạng SMS</div>
    </div>
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="flex flex-row justify-between items-center mb-4">
            <div class="flex flex-row items-center space-x-2 flex-1">
                <div class="flex flex-col justify-end">
                    <p-iconfield>
                        <p-inputicon class="pi pi-search" />
                        <input formControlName="search" pInputText type="text" placeholder="Search" class="w-150" />
                    </p-iconfield>
                </div>
            </div>
          
            <div class="flex flex-row items-center space-x-2">
                <p-button label="Tìm kiếm" type="submit" styleClass="w-32" />
                <p-button label="Thêm mới" styleClass="w-32" (onClick)="onOpenCreate()" type="button" />
            </div>
        </div>
       
    </form>
    <div class="mt-4">
        <app-data-table tableKey="nha-mang" [columns]="columns" [data]="data" [loading]="loading"  [total]="totalRecords" [pageNumber]="query.pageNumber" [pageSize]="query.pageSize" (onPageChanged)="onPageChanged($event)"    (onCustomComp)="onCustomEmit($event)" />
    </div>
</div>
